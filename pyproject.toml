[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-filter"
version = "0.1.0"
description = "Local GLiNER2 + regex PII redaction with human review, for Claude Code"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["gliner2[local]", "fastapi", "uvicorn[standard]", "mcp>=2", "httpx"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pii-redact = "pii_filter.cli:main_exit"
pii-filter-server = "pii_filter.server:main"
pii-filter-mcp = "pii_filter.mcp_server:main"

[tool.setuptools]
packages = ["pii_filter"]

[tool.setuptools.package-data]
pii_filter = ["ui.html"]
